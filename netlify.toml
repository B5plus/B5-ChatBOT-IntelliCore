# Netlify Configuration for B5-ChatBOT-IntelliCore

[build]
  base = "bada test/frontend"
  publish = "public"
  command = ""

# Redirect all routes to index.html for SPA support
[[redirects]]
  from = "/*"
  to = "/landing.html"
  status = 200

# Cache settings - Disable caching for HTML and JS files
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

